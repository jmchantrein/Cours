---
# Exercice 4 : l'auteur par défaut est défini une fois (ancre &), réutilisé
# tel quel (alias *), ou recopié puis surchargé (clé de fusion <<).
# L'année de naissance est typée explicitement comme un entier (!!int).
auteur_defaut: &auteur_defaut
  nom: Aldous Huxley
  naissance: !!int 1894
  nationalite: britannique

livres:
  - titre: "1984"
    auteur:
      <<: *auteur_defaut
      nom: George Orwell
      naissance: !!int 1903
    annee_publication: 1949
    genre: Dystopie
    mots_cles:
      - dystopie
      - politique
      - science-fiction
  - titre: Le meilleur des mondes
    auteur: *auteur_defaut
    annee_publication: 1932
    genre: Dystopie
    mots_cles:
      - dystopie
      - politique
      - science-fiction
  - titre: Les portes de la perception
    auteur: *auteur_defaut
    annee_publication: 1954
    genre: Essai
    mots_cles:
      - philosophie
      - perception
      - science
