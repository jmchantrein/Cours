  - {cours: git, module: "À vous : versionner un script de sauvegarde", requiert: [scripts]}
  - {cours: git, module: ".gitignore", requiert: [fichiers]}   # jokers
  - {cours: acces-distants, module: "SSH : clés, ~/.ssh/config", requiert: [arbo, droits]}   # StrictModes : 600, 700
  - {cours: acces-distants, module: "scp et rsync", requiert: [arbo]}
  - {cours: acces-distants, module: "Modifier sshd_config, durcir", requiert: [sed]}
  - {cours: acces-distants, module: "tmux piloté par script", requiert: [scripts]}
  - {cours: acces-distants, module: "WireGuard : clés (wg genkey | tee | wg pubkey)", requiert: [flux, droits]}
  - {cours: ansible, module: "Introduction : la boucle ssh dérive", requiert: [langage, scripts]}
  - {cours: ansible, module: "shell et command : changed à chaque passage", requiert: [robustesse]}
  - {cours: conteneurisation, module: "Chroot : copier bash et ses bibliothèques", requiert: [arbo, droits, flux, expansions]}
  - {cours: conteneurisation, module: "Persistance : montages", requiert: [arbo, droits]}
  - {cours: conteneurisation, module: "Journaux : sur la sortie standard", requiert: [flux]}
  - {cours: conteneurisation, module: "Fork bomb ; forme exec ou shell ; --init", requiert: [portee]}   # et les signaux, absents
  - {cours: conteneurisation, module: "Dockerfile : variables, CMD et ENTRYPOINT", requiert: [expansions]}
  - {cours: virtualisation, module: "Télécharger l’ISO, puis la vérifier", requiert: [fichiers, flux]}
  - {cours: virtualisation, module: "Administrer avec libvirt (virsh, virt-install)", requiert: [intro, arbo]}
