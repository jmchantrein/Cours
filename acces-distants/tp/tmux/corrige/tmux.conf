# ~/.tmux.conf : lu au démarrage du serveur tmux, une habitude par ligne.
# Recharger à chaud : préfixe r (défini plus bas), ou préfixe : puis source-file ~/.tmux.conf

# La souris choisit le panneau, redimensionne, fait défiler l'historique.
set -g mouse on

# 50 000 lignes d'historique par panneau (2 000 par défaut) ; ne vaut que pour les fenêtres créées ensuite.
set -g history-limit 50000

# Le mode copie (préfixe [) en touches de Vim : / cherche, Espace commence la sélection,
# Entrée la copie et sort, q sort ; préfixe ] colle. (v ne sélectionne pas : il bascule en sélection rectangulaire.)
setw -g mode-keys vi

# Fenêtres et panneaux numérotés à partir de 1, comme les touches du clavier ;
# à la fermeture d'une fenêtre, les suivantes sont renumérotées.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Des touches qui dessinent la coupure ; % et " restent. (_ plutôt que - : préfixe - supprime le dernier tampon copié.)
bind | split-window -h
bind _ split-window -v

# préfixe r : relire ce fichier, et le dire.
bind r source-file ~/.tmux.conf \; display-message "configuration rechargée"
