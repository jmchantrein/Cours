# /etc/wireguard/wg0.conf de pair-a. Les valeurs entre chevrons se lisent dans /etc/wireguard des pairs.
[Interface]
PrivateKey = <clé privée de pair-a>
Address = 10.9.9.1/24
ListenPort = 51820

[Peer]
# pair-b
PublicKey = <clé publique de pair-b>
AllowedIPs = 10.9.9.2/32
Endpoint = 172.20.0.3:51820
