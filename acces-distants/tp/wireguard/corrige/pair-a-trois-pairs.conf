# /etc/wireguard/wg0.conf de pair-a, étape 6 : un bloc [Peer] de plus, pour pair-c.
[Interface]
PrivateKey = <clé privée de pair-a>
Address = 10.9.9.1/24
ListenPort = 51820

[Peer]
# pair-b
PublicKey = <clé publique de pair-b>
AllowedIPs = 10.9.9.2/32
Endpoint = 172.20.0.3:51820

[Peer]
# pair-c
PublicKey = <clé publique de pair-c>
AllowedIPs = 10.9.9.3/32
Endpoint = 172.20.0.4:51820
