# /etc/ssh/sshd_config.d/10-durcissement.conf — lu avant 50-cloud-init.conf :
# pour chaque mot-clé, sshd garde la première valeur lue.
# Plus de mot de passe : la clé seulement.
PasswordAuthentication no
# Ni par le clavier interactif (PAM pourrait y demander le mot de passe).
KbdInteractiveAuthentication no
# root n'entre pas, même par clé : on entre en ada, puis sudo.
PermitRootLogin no
