name: Compilation des supports (Typst)

# Chaque cours est un dossier <cours>/ ; ses diapos sont dans <cours>/cm/<cours>.typ ;
# un PDF par variante est publié à côté : <cours>/cm/<cours>-<variante>.pdf
# (projection, puis les rendus adaptés ; liste dans commun/charte.typ).
# Chaque TP est un dossier <cours>/tp/<tp>/ contenant <tp>.typ, compilé en page web <cours>/tp/<tp>/index.html ;
# index.typ donne la page d’accueil index.html. Les pages web embarquent toutes les variantes.
on:
  push:
    branches: [main]
    paths:
      - "*/cm/*.typ"
      - "*/tp/**"
      - "index.typ"
      - "commun/**"
      - ".github/workflows/compilation-cours.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compilation-cours
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15"

      - name: Compilation
        run: |
          for src in */cm/*.typ; do
            cours=${src%%/*}
            [ "$src" = "$cours/cm/$cours.typ" ] || continue
            for variante in projection deuteranopie protanopie tritanopie achromatopsie dyslexie; do
              pdf="$cours/cm/$cours-$variante.pdf"
              echo "::group::$pdf"
              typst compile --root . --font-path commun/fonts --input variante="$variante" "$src" "$pdf"
              git add "$pdf"
              echo "::endgroup::"
            done
          done

      - name: Compilation des pages web
        run: |
          web() { typst compile --root . --font-path commun/fonts --features html --format html "$1" "$2" && git add "$2"; }
          for src in */tp/*/*.typ; do
            dossier=$(dirname "$src")
            [ "$src" = "$dossier/$(basename "$dossier").typ" ] || continue
            echo "::group::$dossier/index.html"
            web "$src" "$dossier/index.html"
            echo "::endgroup::"
          done
          web index.typ index.html

      - name: Publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Supports inchangés, rien à publier."
          else
            git commit -m "Compile les supports des cours"
            git push
          fi
