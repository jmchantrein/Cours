name: Compilation et publication des supports (Typst)

# Compile les supports et publie le site GitHub Pages (source « GitHub Actions »).
# Rien n'est commité : les PDF et les pages web sont générés ici, ignorés par git, et déposés sur le site.
# Toute la construction est dans commun/construire-site.sh, appliqué à un arbre du dépôt :
# - diapos : <cours>/cm/<cours>.typ donne un PDF par variante, <cours>/cm/<cours>-<variante>.pdf
#   (projection, puis les rendus adaptés ; liste dans commun/charte.typ) ;
# - pages web : <cours>/tp/<tp>/<tp>.typ, <cours>/artefacts/<nom>/<nom>.typ et index.typ donnent chacun
#   un index.html à côté de leur source ; elles embarquent toutes les variantes ;
# - terminal des pages web (commun/terminal/) : dépendances tierces à SHA-256 fixé et image de la VM dans
#   commun/terminal/vendor/, exécutables de host-shell-access dans commun/terminal/host-shell-access/dist/, vérifiés avant publication.
# Deux cas :
# - push sur main, ou lancement manuel sur main : le site est le dépôt, complété des fichiers générés ;
# - lancement manuel sur une autre branche (aperçu) : la racine du site est la branche main, reconstruite, et
#   la branche lancée est publiée sous apercu/, sans rien changer à la production. Un seul aperçu à la fois :
#   la publication suivante, depuis main ou depuis une autre branche, remplace le précédent.
on:
  push:
    branches: [main]
    paths:
      - "*/cm/**"
      - "*/pages/**"
      - "*/tp/**"
      - "*/artefacts/**"
      - "*/progression.yaml"
      - "index.typ"
      - "commun/**"
      - ".github/workflows/compilation-cours.yml"
  workflow_dispatch:

permissions:
  contents: read

# Une publication à la fois ; celle qui est en cours va à son terme.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Deux tâches, comme le recommande GitHub : l'archive du site est déposée par la première, publiée par la
  # seconde. Dans une seule tâche, la publication cherchait parfois l'archive avant qu'elle ne soit listée.
  compilation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Aperçu : la production (main) est extraite à côté, dans principal/ ; la branche lancée y est copiée
      # dans apercu/, avant toute construction.
      - name: Aperçu, extraction de main et copie de la branche
        if: github.ref != 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          ref: main
          path: principal

      - name: Aperçu, branche sous apercu/
        if: github.ref != 'refs/heads/main'
        run: |
          mkdir principal/apercu
          tar --exclude=./.git --exclude=./principal -cf - . | tar -xf - -C principal/apercu

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15"

      - uses: actions/setup-go@v5
        with:
          go-version-file: commun/terminal/host-shell-access/go.mod
          cache-dependency-path: commun/terminal/host-shell-access/go.sum

      - name: Construction du site
        if: github.ref == 'refs/heads/main'
        run: commun/construire-site.sh .

      # Chaque arbre est construit par le script de la branche lancée.
      - name: Construction du site, aperçu
        if: github.ref != 'refs/heads/main'
        env:
          BRANCHE: ${{ github.ref_name }}
        run: |
          commun/construire-site.sh principal
          APERCU_BRANCHE="$BRANCHE" commun/construire-site.sh principal/apercu

      # Le site est le dépôt, complété des supports compilés ci-dessus (aperçu : l'arbre de main et son apercu/).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.ref == 'refs/heads/main' && '.' || 'principal' }}

  publication:
    needs: compilation
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@v4

      - name: Résumé, adresse de l'aperçu
        if: github.ref != 'refs/heads/main'
        env:
          BRANCHE: ${{ github.ref_name }}
          SITE: ${{ steps.publication.outputs.page_url }}
        run: |
          {
            echo "### Aperçu de la branche \`$BRANCHE\`"
            echo
            echo "${SITE%/}/apercu/"
            echo
            echo "La racine du site est celle de \`main\`. Cet aperçu est public ; la prochaine publication l'efface."
          } >> "$GITHUB_STEP_SUMMARY"
