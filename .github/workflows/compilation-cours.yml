name: Compilation et publication des supports (Typst)

# Compile les supports et publie le site GitHub Pages (source « GitHub Actions »).
# Rien n'est commité : les PDF et les pages web sont générés ici, ignorés par git, et déposés sur le site.
# - diapos : <cours>/cm/<cours>.typ donne un PDF par variante, <cours>/cm/<cours>-<variante>.pdf
#   (projection, puis les rendus adaptés ; liste dans commun/charte.typ) ;
# - pages web : <cours>/tp/<tp>/<tp>.typ, <cours>/artefacts/<nom>/<nom>.typ et index.typ donnent chacun
#   un index.html à côté de leur source ; elles embarquent toutes les variantes ;
# - terminal des pages web (commun/terminal/) : dépendances tierces à SHA-256 fixé et image de la VM dans
#   commun/terminal/vendor/, exécutables du compagnon dans commun/terminal/compagnon/dist/, vérifiés avant publication.
on:
  push:
    branches: [main]
    paths:
      - "*/cm/*.typ"
      - "*/tp/**"
      - "*/artefacts/**"
      - "index.typ"
      - "commun/**"
      - ".github/workflows/compilation-cours.yml"
  workflow_dispatch:

permissions:
  contents: read

# Une publication à la fois ; celle qui est en cours va à son terme.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Deux tâches, comme le recommande GitHub : l'archive du site est déposée par la première, publiée par la
  # seconde. Dans une seule tâche, la publication cherchait parfois l'archive avant qu'elle ne soit listée.
  compilation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15"

      - uses: actions/setup-go@v5
        with:
          go-version-file: commun/terminal/compagnon/go.mod
          cache-dependency-path: commun/terminal/compagnon/go.sum

      # xterm.js, v86 et ses BIOS (sommes dans dependances.txt), puis l'image Alpine de la VM (Docker), démarrée
      # une fois dans Node pour vérifier ses outils.
      - name: Terminal, VM dans le navigateur
        run: |
          commun/terminal/preparer.sh --vm
          node commun/terminal/tester-vm.mjs

      # Exécutables statiques du compagnon (Linux et macOS, amd64 et arm64), SHA256SUMS, puis test du protocole.
      - name: Terminal, compagnon
        run: |
          commun/terminal/compagnon/construire.sh
          python3 -I commun/terminal/compagnon/tester.py

      - name: Compilation des diapos
        run: |
          for src in */cm/*.typ; do
            cours=${src%%/*}
            [ "$src" = "$cours/cm/$cours.typ" ] || continue
            for variante in projection deuteranopie protanopie tritanopie achromatopsie dyslexie; do
              pdf="$cours/cm/$cours-$variante.pdf"
              echo "::group::$pdf"
              typst compile --root . --font-path commun/fonts --input variante="$variante" "$src" "$pdf"
              echo "::endgroup::"
            done
          done

      - name: Compilation des pages web
        run: |
          web() { typst compile --root . --font-path commun/fonts --features html --format html "$1" "$2"; }
          for src in */tp/*/*.typ */artefacts/*/*.typ; do
            [ -f "$src" ] || continue
            dossier=$(dirname "$src")
            [ "$src" = "$dossier/$(basename "$dossier").typ" ] || continue
            echo "::group::$dossier/index.html"
            web "$src" "$dossier/index.html"
            echo "::endgroup::"
          done
          web index.typ index.html
          web commun/terminal/compagnon.typ commun/terminal/index.html

      # Le site est le dépôt, complété des supports compilés ci-dessus.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  publication:
    needs: compilation
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@v4
