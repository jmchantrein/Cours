name: Test des corrigés de TP

# Chaque TP qui a des corrigés exécutables (<cours>/tp/<tp>/corrige/) fournit à
# côté un harnais <cours>/tp/<tp>/tester.sh. Ce workflow rejoue en mode --up
# chaque harnais dont le TP a changé, dans un job à lui : un harnais qui dépasse
# son délai n'emporte pas le bilan des autres.
#
# Un harnais peut déclarer, dans les commentaires de son en-tête :
#   ci-delai: 180          délai du job, en minutes (90 par défaut) ;
#   ci-prerequis: incus    installer et initialiser Incus avant de le lancer.
on:
  push:
    paths:
      - "*/tp/*/corrige/**"
      - "*/tp/*/tester.sh"
      - ".github/workflows/test-corriges.yml"
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push sur la même branche remplace le test en cours.
concurrency:
  group: test-corriges-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decouverte:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      harnais: ${{ steps.liste.outputs.harnais }}
    steps:
      - uses: actions/checkout@v4
        with:
          # L'historique permet de comparer avec le commit précédent du push.
          fetch-depth: 0

      - name: Un harnais par TP corrigé
        run: |
          manquants=0
          for corrige in */tp/*/corrige; do
            [ -d "$corrige" ] || continue
            harnais="$(dirname "$corrige")/tester.sh"
            if [ ! -x "$harnais" ]; then
              echo "::error file=$corrige::$corrige n'a pas de harnais exécutable $harnais"
              manquants=1
            fi
          done
          exit "$manquants"

      # Tous les harnais si le workflow change, s'il est lancé à la main, ou si
      # le commit précédent est inconnu (nouvelle branche) ; sinon, ceux des TP
      # dont le corrigé ou le harnais a changé.
      - name: Harnais à jouer
        id: liste
        env:
          AVANT: ${{ github.event.before }}
          EVENEMENT: ${{ github.event_name }}
        run: |
          tous=""
          if [ "$EVENEMENT" != "push" ] || ! git cat-file -e "${AVANT:-0000000}^{commit}" 2> /dev/null; then
            tous="1"
          elif git diff --name-only "$AVANT" HEAD | grep -qx '.github/workflows/test-corriges.yml'; then
            tous="1"
          fi
          entrees=()
          for harnais in */tp/*/tester.sh; do
            [ -f "$harnais" ] || continue
            tp="$(dirname "$harnais")"
            if [ -z "$tous" ] && [ -z "$(git diff --name-only "$AVANT" HEAD -- "$tp/corrige" "$harnais")" ]; then
              echo "$tp : inchangé"
              continue
            fi
            delai="$(sed -n 's/^#[[:space:]]*ci-delai:[[:space:]]*\([0-9][0-9]*\)[[:space:]]*$/\1/p' "$harnais" | head -n 1)"
            prerequis="$(sed -n 's/^#[[:space:]]*ci-prerequis:[[:space:]]*//p' "$harnais" | head -n 1)"
            incus=false
            case " $prerequis " in *" incus "*) incus=true ;; esac
            echo "$tp : délai ${delai:-90} min, Incus : $incus"
            entrees+=("{\"tp\":\"$tp\",\"delai\":${delai:-90},\"incus\":$incus}")
          done
          liste="[$(IFS=,; echo "${entrees[*]}")]"
          echo "harnais=$liste" >> "$GITHUB_OUTPUT"
          echo "$liste"

  harnais:
    needs: decouverte
    if: needs.decouverte.outputs.harnais != '[]'
    name: ${{ matrix.tp }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.decouverte.outputs.harnais) }}
    # Runner épinglé : la version d'Ubuntu décide des paquets (Docker, Incus) et
    # ne doit pas changer sans qu'on le voie. Ubuntu 26.04 fournit Incus.
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ matrix.delai }}
    steps:
      - uses: actions/checkout@v4

      # Le runner fournit Docker, Compose v2, curl et shellcheck. Les faits
      # utiles au diagnostic d'abord : système, KVM, place disponible.
      - name: Versions
        run: |
          . /etc/os-release && echo "$PRETTY_NAME, noyau $(uname -r), $(nproc) processeurs"
          ls -l /dev/kvm || echo "::warning::/dev/kvm absent : pas de machine virtuelle possible"
          df -h / | tail -n 1
          docker version --format 'Docker {{.Server.Version}}'
          docker compose version
          docker buildx version

      # Un Incus initialisé, comme dans l'énoncé du TP Incus : paquet de la
      # distribution, « incus admin init --minimal », compte dans le groupe incus-admin.
      - name: Incus
        if: matrix.incus
        run: |
          sudo apt-get update
          apt-cache policy incus | head -n 3
          sudo apt-get install -y incus qemu-system-x86 ovmf
          incus --version
          # Ubuntu 26.04 fournit les coreutils de uutils (Rust) : leur dd 0.10
          # lit en O_DIRECT dans un tampon non aligné, et le noyau refuse
          # (EINVAL : « dd: IO error: Invalid input »). Or le pilote dir d'Incus
          # copie le disque d'une VM par « dd … iflag=direct oflag=direct » dès
          # que le fichier s'ouvre en O_DIRECT (copyDevice, internal/server/
          # storage/drivers/utils.go) : instantané et restauration échouent.
          # Debian 13, la cible du TP, a le dd de GNU. Le démon, et lui seul,
          # reçoit donc les coreutils de GNU (paquet gnu-coreutils, commandes
          # préfixées gnu) en tête de son PATH.
          dd --version | head -n 1
          if ! dd --version 2>&1 | head -n 1 | grep -q 'GNU coreutils'; then
            sudo apt-get install -y gnu-coreutils
            sudo mkdir -p /usr/local/lib/incus-gnu /etc/systemd/system/incus.service.d
            for f in $(dpkg -L gnu-coreutils | grep '^/usr/bin/gnu'); do
              sudo ln -sf "$f" "/usr/local/lib/incus-gnu/${f#/usr/bin/gnu}"
            done
            # Un EnvironmentFile ajouté après ceux du paquet l'emporte sur eux.
            echo 'PATH=/usr/local/lib/incus-gnu:/usr/libexec/incus:/usr/sbin:/usr/bin:/sbin:/bin' \
              | sudo tee /etc/default/incus-ci > /dev/null
            printf '[Service]\nEnvironmentFile=/etc/default/incus-ci\n' \
              | sudo tee /etc/systemd/system/incus.service.d/gnu-coreutils.conf > /dev/null
            sudo systemctl daemon-reload
            /usr/local/lib/incus-gnu/dd --version | head -n 1
          fi
          # Ubuntu restreint les espaces de noms utilisateur non privilégiés
          # (kernel.apparmor_restrict_unprivileged_userns=1 ; Debian 13 ne pose
          # pas cette restriction). Dans un conteneur système, le processus
          # qu'un service de systemd 257 crée dans un nouvel espace de noms
          # utilisateur, « (sd-mkuserns) » (userns_acquire), reçoit alors une
          # autre étiquette AppArmor (« incus-…//&unconfined ») ; le profil du
          # conteneur ne permet signal et ptrace que vers sa propre étiquette
          # (signal peer=@{profile_name}) : systemd ne peut ni l'inspecter ni le
          # tuer, et journald, networkd et resolved restent « activating ». Sans
          # networkd, pas de DHCP : les conteneurs n'ont pas d'IPv4.
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns > /dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # Le démon relit ses pilotes (qemu) à son démarrage.
          sudo systemctl restart incus
          echo "PATH du démon : $(sudo cat "/proc/$(pgrep -o -x incusd)/environ" | tr '\0' '\n' | sed -n 's/^PATH=//p')"
          sudo incus admin init --minimal
          sudo usermod -aG incus-admin "$USER"
          sudo incus info | grep -E '^ +(driver|driver_version|server_version|storage|firewall):'
          # Docker, présent sur le runner, fait rejeter le trafic des autres ponts
          # (voir l'énoncé, « Avant de commencer »). tptestbr0 est le pont du harnais.
          if sudo iptables -S DOCKER-USER > /dev/null 2>&1; then
            sudo iptables -I DOCKER-USER -i tptestbr0 -j ACCEPT
            sudo iptables -I DOCKER-USER -o tptestbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
            sudo iptables -S DOCKER-USER
          else
            echo "::warning::chaîne DOCKER-USER absente : si les instances n'ont pas de réseau, voir iptables -S FORWARD ci-dessous"
          fi
          sudo iptables -S FORWARD || true

      # « sudo --user » ouvre une session neuve du même compte : elle a le groupe
      # incus-admin, que le shell de cette étape n'a pas encore.
      # Le harnais s'arrête de lui-même avant le délai du job : sur SIGTERM, il
      # affiche le bilan de ce qu'il a vérifié, puis nettoie.
      - name: Harnais (--up)
        env:
          TP: ${{ matrix.tp }}
          DELAI: ${{ matrix.delai }}
        run: |
          if ! timeout -k 3m "$((DELAI - 12))m" sudo --user "$USER" bash "$TP/tester.sh" --up; then
            echo "::error file=$TP/tester.sh::$TP/tester.sh --up a échoué (bilan à la fin du journal)"
            exit 1
          fi

      # Après un échec, l'état d'Incus tel que le harnais l'a laissé.
      - name: État d'Incus après le harnais
        if: failure() && matrix.incus
        run: |
          sudo incus list --all-projects || true
          sudo journalctl -u incus --no-pager | tail -n 60 || true
