name: Test des corrigés de TP

# Chaque TP qui a des corrigés exécutables (<cours>/tp/<tp>/corrige/) fournit à
# côté un harnais <cours>/tp/<tp>/tester.sh. Ce workflow rejoue chaque
# harnais en mode --up, dans sa propre tâche : construire, démarrer, vérifier,
# nettoyer. Si le harnais demande des paquets apt, il les déclare dans le
# fichier facultatif paquets-apt.txt à côté de lui (un nom par ligne, # pour
# un commentaire) ; la tâche les installe avant de le lancer.
on:
  push:
    paths:
      - "*/tp/*/corrige/**"
      - "*/tp/*/tester.sh"
      - ".github/workflows/test-corriges.yml"
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push sur la même branche remplace le test en cours.
concurrency:
  group: test-corriges-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrice:
    runs-on: ubuntu-latest
    outputs:
      harnais: ${{ steps.liste.outputs.harnais }}
    steps:
      - uses: actions/checkout@v4

      - name: Chaque dossier de corrigés a son harnais
        run: |
          manquants=0
          for corrige in */tp/*/corrige; do
            [ -d "$corrige" ] || continue
            harnais="$(dirname "$corrige")/tester.sh"
            if [ ! -x "$harnais" ]; then
              echo "::error file=$corrige::$corrige n'a pas de harnais exécutable $harnais"
              manquants=1
            fi
          done
          exit "$manquants"

      - name: Liste des harnais
        id: liste
        run: |
          liste="$(ls */tp/*/tester.sh | jq -R . | jq -sc .)"
          echo "$liste"
          echo "harnais=$liste" >> "$GITHUB_OUTPUT"

  corriges:
    needs: matrice
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        harnais: ${{ fromJSON(needs.matrice.outputs.harnais) }}
    name: ${{ matrix.harnais }}
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest fournit Docker, Compose v2, curl et shellcheck.
      - name: Versions
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          docker compose version
          docker buildx version
          shellcheck --version | sed -n 's/^version: /ShellCheck /p'

      - name: Paquets apt du harnais
        env:
          HARNAIS: ${{ matrix.harnais }}
        run: |
          fichier="$(dirname "$HARNAIS")/paquets-apt.txt"
          [ -f "$fichier" ] || exit 0
          paquets="$(sed 's/#.*//' "$fichier" | tr -s '[:space:]' ' ')"
          echo "apt : $paquets"
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $paquets

      - name: Harnais (--up)
        env:
          HARNAIS: ${{ matrix.harnais }}
        run: bash "$HARNAIS" --up
