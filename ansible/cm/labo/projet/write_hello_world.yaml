---
- name: Écrire hello world
  hosts: all
  tasks:
    - name: Écrire /hello, seulement s’il manque
      ansible.builtin.shell: echo hello > /hello
      args:
        creates: /hello

    - name: Écrire /hello_world avec lineinfile
      ansible.builtin.lineinfile:
        path: /hello_world
        line: "Hello world !"
        create: true
        mode: "0644"
