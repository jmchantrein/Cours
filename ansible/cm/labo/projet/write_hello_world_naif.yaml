---
- name: Écrire hello world (version naïve)
  hosts: all
  tasks:
    - name: Écrire /hello avec le module shell
      ansible.builtin.shell: echo hello >> /hello

    - name: Écrire /hello_world avec le module lineinfile
      ansible.builtin.lineinfile:
        path: /hello_world
        line: "Hello world !"
        create: true
        mode: "0644"
