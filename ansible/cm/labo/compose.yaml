# Labo du cours Ansible : un nœud de contrôle, deux nœuds gérés, sur un réseau
# Docker dont le DNS résout les noms des services (l’inventaire les emploie).
# projet/ est monté dans /etc/ansible du nœud de contrôle.
name: ansible-cm
services:
  control-node:
    build:
      context: .
      dockerfile: Dockerfile.control
      secrets: [ca]
    image: ansible-cm-control
    hostname: control-node
    working_dir: /etc/ansible
    volumes:
      - ./projet:/etc/ansible
  managed-node-1:
    build:
      context: .
      dockerfile: Dockerfile.node
    image: ansible-cm-node
    hostname: managed-node-1
  managed-node-2:
    image: ansible-cm-node
    hostname: managed-node-2
    depends_on: [managed-node-1]
secrets:
  ca:
    file: ${CA_PIP:-/dev/null}
