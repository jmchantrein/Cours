# Labo Ansible, commun au cours et aux trois séances de TP : un nœud de contrôle, deux nœuds
# gérés, sur un réseau Docker dont le DNS résout les noms des services (l’inventaire les emploie).
# Le dossier de travail est monté dans /etc/ansible du nœud de contrôle : ANSIBLE_PROJET
# (chemin absolu), ou projet/, les fichiers des diapos. Nom du projet Compose : -p ou
# COMPOSE_PROJECT_NAME, sinon ansible-cm ; les images en prennent le nom.
# Derrière un proxy HTTPS (facultatif) : voir proxy.sh (TPTEST_CA et HTTPS_PROXY).
name: ansible-cm
x-construction: &construction
  context: .
services:
  control-node:
    build:
      <<: *construction
      dockerfile: Dockerfile.control
    hostname: control-node
    working_dir: /etc/ansible
    volumes:
      - ${ANSIBLE_PROJET:-./projet}:/etc/ansible
  managed-node-1:
    build:
      <<: *construction
      dockerfile: Dockerfile.node
    hostname: managed-node-1
  managed-node-2:
    build:
      <<: *construction
      dockerfile: Dockerfile.node
    hostname: managed-node-2
